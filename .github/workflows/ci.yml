# Controleert elke push naar main (en pull requests): lint, dode code,
# unit-tests, build en de functionele e2e-tests. De screenshot-vergelijking
# (npm run test:visual) draait hier bewust niet: GitHubs machine tekent o.a.
# Arabische tekst met een ander systeemfont, dus de pixels wijken af. Vercel deployt los hiervan; faalt CI,
# draai de deploy dan terug via Vercel → Deployments → Instant Rollback.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # Vast op 24.04: op ubuntu-latest (Ubuntu 26) bleef
    # `playwright install --with-deps` minutenlang hangen.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run deadcode
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 5
      - name: E2E (desktop)
        run: npm run test:e2e
      - name: Duplicatie-rapport (nog niet blokkerend)
        if: always()
        run: npx --yes jscpd@5.4.2 src --min-tokens 50 --reporters console --silent
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-resultaten
          path: test-results/
          retention-days: 7
