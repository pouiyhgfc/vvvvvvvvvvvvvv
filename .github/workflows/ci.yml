# Controleert elke push naar main (en pull requests): lint, dode code,
# unit-tests, build en de functionele e2e-tests. De screenshot-vergelijking
# (npm run test:visual) draait hier bewust niet: GitHubs machine tekent o.a.
# Arabische tekst met een ander systeemfont, dus de pixels wijken af. Vercel deployt los hiervan; faalt CI,
# draai de deploy dan terug via Vercel → Deployments → Instant Rollback.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    # Officiële Playwright-image: browser + systeembibliotheken staan er al in.
    # `playwright install --with-deps` bleef op de runner soms minutenlang
    # hangen op apt. Versie gelijk houden aan @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run deadcode
      - run: npm test
      - run: npm run build
      - name: E2E (desktop)
        run: npm run test:e2e
      # Faalt boven 1% gedupliceerde regels (29-10: 0,24%).
      - name: Duplicatie (jscpd)
        run: npx --yes jscpd@5.4.2 src --min-tokens 50 --threshold 1 --reporters console --silent
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-resultaten
          path: test-results/
          retention-days: 7
