<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Routine Tracker</title>

<!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#064e3b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Routine">
<link rel="apple-touch-icon" href="/icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body, #root { height: 100%; }
  :root {
    --ff-head: 'Outfit', sans-serif; --ff-body: 'DM Sans', sans-serif;
    --bg:#f8f7f4; --card:#ffffff; --card2:#fafaf9;
    --text:#1f2937; --text-muted:#6b7280; --text-faint:#9ca3af;
    --border:#e5e7eb; --border-soft:#f0efeb; --border-mid:#e8e5df;
    --input-bg:#fafafa; --shadow:rgba(0,0,0,.06);
    --tint-alpha:18;
    --accent-bg:#f0fdf4; --accent-border:#bbf7d0; --accent-text:#065f46; --sel-bg:#ecfdf5;
    --danger-bg:#fef2f2; --danger-border:#fecaca; --danger-text:#b91c1c;
    --purple-bg:#f5f3ff; --purple-border:#ddd6fe; --purple-text:#6d28d9;
    --heat0:#f0efeb;
  }
  html[data-theme="dark"] {
    --bg:#0f1311; --card:#1a201d; --card2:#222a26;
    --text:#e7ece9; --text-muted:#9aa6a0; --text-faint:#6b7770;
    --border:#2c3531; --border-soft:#242b27; --border-mid:#2c3531;
    --input-bg:#222a26; --shadow:rgba(0,0,0,.45);
    --tint-alpha:30;
    --accent-bg:#10241b; --accent-border:#1d4332; --accent-text:#6ee7b7; --sel-bg:#16291f;
    --danger-bg:#2a1618; --danger-border:#4a2429; --danger-text:#f87171;
    --purple-bg:#1c1830; --purple-border:#352c54; --purple-text:#c4b5fd;
    --heat0:#222a26;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); transition: background .25s; }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.3)} 100%{transform:scale(1)} }
  @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  @keyframes slideDown { from{opacity:0;max-height:0} to{opacity:1;max-height:600px} }
  input[type=range]{-webkit-appearance:none;height:6px;border-radius:3px;background:var(--border);outline:none;width:100%}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#059669;cursor:pointer;border:3px solid var(--card);box-shadow:0 2px 6px rgba(0,0,0,.15)}
  textarea,input[type=text],input[type=time]{font-family:var(--ff-body)}
  input[type=time]{color-scheme:light}
  html[data-theme="dark"] input[type=time]{color-scheme:dark}
  button{font-family:var(--ff-body);cursor:pointer;border:none;outline:none}
  input[type=text],input[type=time],textarea,select{color:var(--text);background:var(--card)}
  input::placeholder,textarea::placeholder{color:var(--text-faint)}
  .routine-item:active{transform:scale(0.98)}
  .cal-hour-cell:hover{background:rgba(5,150,105,.06)!important}
  .drag-handle{touch-action:none;cursor:grab}
  .drag-handle:active{cursor:grabbing}
  [data-srow="1"]{transition:transform .18s cubic-bezier(.2,.8,.2,1)}
  .dragging{box-shadow:0 10px 28px rgba(0,0,0,.22)!important}
  @media(max-width:400px){.period-tabs{gap:3px!important}.period-tabs button{font-size:11px!important;padding:8px 4px!important}}
  /* toggle switch */
  .switch{position:relative;display:inline-block;width:44px;height:25px;flex-shrink:0}
  .switch input{opacity:0;width:0;height:0}
  .switch .slider-tg{position:absolute;inset:0;background:var(--border);border-radius:25px;transition:.25s}
  .switch .slider-tg:before{content:"";position:absolute;height:19px;width:19px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .switch input:checked + .slider-tg{background:#059669}
  .switch input:checked + .slider-tg:before{transform:translateX(19px)}
</style>
</head>
<body>
<div id="root"></div>
<script src="/app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
