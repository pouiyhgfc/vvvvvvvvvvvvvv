<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Routine Tracker</title>

<!-- PWA -->
<meta name="theme-color" content="#0a3d2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Routine">
<link rel="apple-touch-icon" href="/icon-192.png">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body, #root { height: 100%; }
  :root {
    --ff-display: 'Schibsted Grotesk Variable', sans-serif;
    --ff-head: 'Outfit Variable', sans-serif; --ff-body: 'DM Sans Variable', sans-serif;
    --bg:#f6f5f1; --card:#ffffff; --card2:#fbfaf7;
    --text:#1a211e; --text-muted:#697069; --text-faint:#a2a8a2;
    --border:#e9e7e1; --border-soft:#f1efe9; --border-mid:#e9e7e1;
    --input-bg:#f8f7f3; --shadow:rgba(20,30,25,.06);
    --tint-alpha:18;
    --accent:#0e7a52; --accent-strong:#0a5a3c; --accent-contrast:#ffffff;
    --accent-bg:#eef7f2; --accent-border:#c5e6d6; --accent-text:#0a5a3c; --sel-bg:#f0f8f4;
    --danger-bg:#fdf3f2; --danger-border:#f3d2cf; --danger-text:#c0392f;
    --purple-bg:#f5f3ff; --purple-border:#ddd6fe; --purple-text:#6d28d9;
    --heat0:#f1efe9;
  }
  html[data-theme="dark"] {
    --bg:#0e1210; --card:#171c19; --card2:#1f2521;
    --text:#e8ece9; --text-muted:#98a09a; --text-faint:#646b66;
    --border:#2a312d; --border-soft:#242b27; --border-mid:#2a312d;
    --input-bg:#1f2521; --shadow:rgba(0,0,0,.45);
    --tint-alpha:30;
    --accent:#1fa06a; --accent-strong:#5fd6a0; --accent-contrast:#06140d;
    --accent-bg:#10251b; --accent-border:#1d4534; --accent-text:#5fd6a0; --sel-bg:#13271d;
    --danger-bg:#2a1614; --danger-border:#4a2521; --danger-text:#f0867c;
    --purple-bg:#1c1830; --purple-border:#352c54; --purple-text:#c4b5fd;
    --heat0:#242b27;
  }
  body { font-family: 'DM Sans Variable', sans-serif; background: var(--bg); color: var(--text); transition: background .25s; }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.3)} 100%{transform:scale(1)} }
  @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  @keyframes slideDown { from{opacity:0;max-height:0} to{opacity:1;max-height:600px} }
  input[type=range]{-webkit-appearance:none;height:6px;border-radius:3px;background:var(--border);outline:none;width:100%}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);cursor:pointer;border:3px solid var(--card);box-shadow:0 2px 6px rgba(0,0,0,.15)}
  textarea,input[type=text],input[type=time]{font-family:var(--ff-body)}
  input[type=time]{color-scheme:light}
  html[data-theme="dark"] input[type=time]{color-scheme:dark}
  button{font-family:var(--ff-body);cursor:pointer;border:none;outline:none}
  input[type=text],input[type=time],textarea,select{color:var(--text);background:var(--card)}
  input::placeholder,textarea::placeholder{color:var(--text-faint)}
  .routine-item:active{transform:scale(0.98)}
  .cal-hour-cell:hover{background:rgba(14,122,82,.06)!important}
  .drag-handle{touch-action:none;cursor:grab}
  .drag-handle:active{cursor:grabbing}
  [data-srow="1"]{transition:transform .18s cubic-bezier(.2,.8,.2,1)}
  .dragging{box-shadow:0 10px 28px rgba(0,0,0,.22)!important}
  @media(max-width:400px){.period-tabs{gap:3px!important}.period-tabs button{font-size:11px!important;padding:8px 4px!important}}
  /* toggle switch */
  .switch{position:relative;display:inline-block;width:44px;height:25px;flex-shrink:0}
  .switch input{opacity:0;width:0;height:0}
  .switch .slider-tg{position:absolute;inset:0;background:var(--border);border-radius:25px;transition:.25s}
  .switch .slider-tg:before{content:"";position:absolute;height:19px;width:19px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .switch input:checked + .slider-tg{background:var(--accent)}
  .switch input:checked + .slider-tg:before{transform:translateX(19px)}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
